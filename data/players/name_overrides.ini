# Verified name overrides for players our automatic matching cannot resolve.
#
# Format: sportspredict_name = canonical_name_in_our_data
#
# Only for GENUINE collisions - two different players sharing a first initial
# and surname - where no amount of string handling can decide, and where
# picking by career record would be a guess rather than an inference.
#
# Every entry here was checked against the published draw. Do not add an entry
# without doing the same: a wrong override is worse than no override, because it
# silently supplies a real but incorrect player's ratings and every downstream
# check passes.
#
# WHY THIS FILE EXISTS, with the case that justifies it:
#
#   "X. Wang" in the 2026 draw is Xiyu Wang (98 matches in our data), not Xinyu
#   Wang (157). The automatic rule breaks ties by career record and would have
#   chosen Xinyu - the wrong player - had its dominance threshold been any lower
#   than 10x. It correctly refused at a ratio of 1.6 and left the name
#   unresolved, which is what made the problem visible at all.
#
# Players absent from our data entirely are listed with an empty value. They are
# priced at the tour average, which is the honest answer when we know nothing.

[atp]
D. Blanch = Darwin Blanch

[wta]
X. Wang = Xiyu Wang
S. Sierra = Solana Sierra
# Thea Frodin: American wildcard, no matches in our data at all.
T. Frodin =
