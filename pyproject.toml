[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grand-slam-challenge"
version = "1.0.1"
description = "Archived US Open 2026 probability-forecasting system and private research record."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jakub Piotrowski" }]
keywords = [
    "probability-forecasting",
    "brier-score",
    "tennis-analytics",
    "us-open",
    "monte-carlo",
    "forecasting-bot",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.6",
    "pre-commit>=4.6",
    "pytest>=9.0",
    "ruff>=0.16",
    "setuptools>=84.0",
]
plots = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/DataAthleteChamp/grand-slam-challenge-us-open"

[tool.setuptools]
packages = [
    "bot",
    "bot.sportspredict",
    "bot.markets",
    "bot.models",
    "bot.data",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["bot/tests"]
addopts = "-q"
