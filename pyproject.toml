[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grand-slam-challenge"
version = "0.1.0"
description = "A quant forecasting system + live API bot for the SportsPredict Grand Slam Challenge 2026 (US Open)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jakub Piotrowski" }]
keywords = [
    "probability-forecasting",
    "brier-score",
    "tennis-analytics",
    "us-open",
    "monte-carlo",
    "forecasting-bot",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pre-commit>=3.0", "ruff>=0.5"]
plots = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/DataAthleteChamp/grand-slam-challenge-us-open"

[tool.setuptools]
packages = [
    "bot",
    "bot.sportspredict",
    "bot.markets",
    "bot.models",
    "bot.data",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["bot/tests"]
addopts = "-q"
